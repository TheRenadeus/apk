name: Actualizar precios

on:
  schedule:
    # Todos los días, cerca de las 8:15 hora de Chile (UTC-3).
    - cron: '13 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leer precios de los supermercados
        run: node scripts/update-prices.mjs

      - name: Subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios/data
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar precios del día"
          # La tarea del dólar también sube cambios: si llegó antes, se integra y se reintenta.
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
